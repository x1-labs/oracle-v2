[package]
name = "oracle-v2"
version = "0.1.0"
description = "Oracle V2 — on-chain price oracle with bounds, median, circuit breaker, dynamic keys"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_v2"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
