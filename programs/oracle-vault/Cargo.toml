[package]
name = "oracle-vault"
version = "0.1.0"
description = "Oracle Vault — Ed25519/OpenBao-signed price oracle for X1/Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
