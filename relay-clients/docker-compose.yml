services:
  relay-1:
    build: .
    container_name: oracle-relay-1
    environment:
      - CLIENT_ID=relay-1
      - VAULT_ADDR=http://64.20.42.194:8200
      - VAULT_TOKEN=${RELAY_TOKEN}
      - KEY_NAME=oracle-price-signer
      - INTERVAL=10
      - PRICE_FEED=http://64.20.42.194:8281
      - KEYPAIR_PATH=/keys/relay-1.json
      - RPC_URL=https://rpc.mainnet.x1.xyz
      - PROGRAM_ID=9mPmjK8NxJadYDiHiYAQH4WFCnKJr7ZV8ria63ZkMtv2
      - TRANSIT_PUBKEY=8tJv+C6x1PKBtzapaR2Zx8TM8YqeDGzStfVspLBgw1w=
    volumes:
      - ./keys:/keys:ro
    restart: unless-stopped
