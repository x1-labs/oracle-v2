name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: oracle-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --locked --workspace

      - name: Test Rust workspace
        run: cargo test --locked --workspace

      - name: Check Python syntax
        run: npm run check:python

      - name: Build relay image
        run: docker build --file relay-clients/Dockerfile --tag oracle-relay:ci .

      - name: Build price-feed image
        run: docker build --file price-feed/Dockerfile --tag oracle-price-feed:ci .
